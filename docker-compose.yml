services:
  mysql:
    image: mysql:8.0.33
    container_name: xiaoming-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: community_platform
      TZ: Asia/Shanghai
    ports: ["127.0.0.1:13306:3306"]
    volumes:
      - ./docker/mysql:/var/lib/mysql
      - ./sql/community_platform.sql:/docker-entrypoint-initdb.d/community_platform.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:6.2-alpine
    container_name: xiaoming-redis
    ports: ["127.0.0.1:6379:6379"]
    command: redis-server --appendonly yes
    volumes: ["./docker/redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: xiaoming-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: xiaoming
      RABBITMQ_DEFAULT_PASS: xiaoming-local
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: ["./docker/rabbitmq:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
  elasticsearch:
    image: xiaoming-elasticsearch:8.11.0-ik
    build: ./docker/elasticsearch
    container_name: xiaoming-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["127.0.0.1:9200:9200"]
    volumes: ["./docker/elasticsearch/data:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 30
  minio:
    image: xiaoming-minio:source-7aac2a2
    build: ./docker/minio-build
    container_name: xiaoming-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["./docker/minio:/data"]
  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xiaoming-community-app
    ports: ["127.0.0.1:8080:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: test
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
      minio: {condition: service_started}
