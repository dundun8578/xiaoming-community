server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: xiaoming-community

  profiles:
    active: dev

  # knife4j 3.0.3 内置的 springfox 3.0.0 与 Spring Boot 2.6+ 的路径匹配策略不兼容，
  # 不切回 ant_path_matcher 会在启动时报 documentationPluginsBootstrapper 空指针。
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.xiaoming.**.entity

logging:
  level:
    root: info
    com.xiaoming: debug
    org.springframework.web: info
    com.baomidou.mybatisplus: debug


jwt:
  secret: ${JWT_SECRET:xiaoming-community-local-development-secret-2026}
  access-token-validity: 1800000
  refresh-token-validity: 2592000000
  token-prefix: "Bearer "

# 消费成功后自动确认；失败有限重试，最终进入死信队列
spring.rabbitmq.listener.simple.acknowledge-mode: auto
spring.rabbitmq.listener.simple.default-requeue-rejected: false
spring.rabbitmq.listener.simple.retry.enabled: true
spring.rabbitmq.listener.simple.retry.max-attempts: 3

search.analyzer: ik_max_word


ai:
  moderation:
    enabled: ${AI_MODERATION_ENABLED:false}
    url: ${AI_MODERATION_URL:}
    api-key: ${AI_MODERATION_API_KEY:}
    model: ${AI_MODERATION_MODEL:}

spring.rabbitmq.publisher-confirm-type: correlated
spring.rabbitmq.publisher-returns: true
