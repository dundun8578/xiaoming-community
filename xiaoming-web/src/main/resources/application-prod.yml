# 生产环境配置
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/community_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: prod_user
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 10
      min-idle: 10
      max-active: 50
      max-wait: 60000

  redis:
    host: redis
    port: 6379
    password: ${REDIS_PASSWORD}
    database: 0

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: rabbitmq_user
    password: ${RABBITMQ_PASSWORD}

  elasticsearch:
    rest:
      uris: http://elasticsearch:9200

minio:
  endpoint: http://minio:9000
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: community-platform

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 604800000
  refresh-token-validity: 2592000000
