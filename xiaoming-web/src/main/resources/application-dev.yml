# 开发环境配置
spring:
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT:13306}/community_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      validation-query: SELECT 1 FROM DUAL
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      filters: stat,wall,log4j2

  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 5000
    connect-timeout: 5000
    timeout: 5000

  rabbitmq:
    host: localhost
    port: 5672
    username: xiaoming
    password: xiaoming-local
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
    publisher-confirm-type: correlated
    publisher-returns: true

  elasticsearch:
    rest:
      uris: http://localhost:9200

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: community-platform

jwt:
  secret: ${JWT_SECRET:xiaoming-community-local-development-secret-2026}
  access-token-validity: 1800000 # 30分钟
  refresh-token-validity: 2592000000 # 30天 (毫秒)
  token-prefix: "Bearer "
