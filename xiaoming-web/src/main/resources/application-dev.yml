# 开发环境配置
spring:
  datasource:
    url: jdbc:mysql:<SECRET_54f53270>    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      validation-query: SELECT 1 FROM DUAL
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      filters: stat,wall,log4j2

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 5000
      connect-timeout: 5000
      timeout: 5000

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          max-attempts: 3
    publisher-confirm-type: correlated
    publisher-returns: true

  elasticsearch:
    rest:
      uris: http://localhost:9200

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: community-platform

jwt:
  secret: xiaoming-community-secret-key-2024
  access-token-validity: 604800000  # 7天 (毫秒)
  refresh-token-validity: 2592000000 # 30天 (毫秒)
  token-prefix: "Bearer "
